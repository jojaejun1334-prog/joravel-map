<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조래블(Jo-ravel) 후쿠오카 정보 총 정리</title>
    <!-- PWA 앱 설정 연결 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF5A36">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="조래블맵">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 상단 네비게이션 */
        header { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 999; flex-shrink: 0; }
        .logo-area { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .logo-badge { background: #FF5A36; color: white; font-weight: 700; padding: 4px 10px; border-radius: 20px; font-size: 12px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(255, 90, 54, 0.3); }
        h1 { font-size: 14px; font-weight: 800; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .yt-btn { background: #fee2e2; color: #dc2626; padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; z-index: 1000; }
        .map-big-btn { background: #FF5A36; color: white; padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; z-index: 1000; box-shadow: 0 2px 8px rgba(255, 90, 54, 0.3); }
        
        /* 메인 컨테이너 */
        .main-container { display: flex; flex: 1; position: relative; overflow: hidden; }
        
        /* 지도 영역 */
        .map-section { flex: 1.2; background: #e2e8f0; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .map-iframe { width: 100%; height: 100%; border: none; filter: saturate(1.1) contrast(1.05); }
        
        /* 장소 카드 사이드바 */
        .sidebar { width: 420px; background: white; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; z-index: 50; box-shadow: -4px 0 20px rgba(0,0,0,0.05); }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #f1f5f9; background: #fff; }
        .sidebar-header h2 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
        .sidebar-header p { font-size: 11px; color: #64748b; }
        
        .card-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .place-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; transition: all 0.2s ease; cursor: pointer; position: relative; }
        .place-card:hover { border-color: #FF5A36; box-shadow: 0 4px 15px rgba(255, 90, 54, 0.1); }
        .place-card.active { border-color: #FF5A36; background: #fffaf9; box-shadow: 0 4px 15px rgba(255, 90, 54, 0.15); }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .place-num { background: #FF5A36; color: white; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
        .place-title { font-size: 14px; font-weight: 700; color: #0f172a; flex: 1; margin-left: 8px; }
        .place-tag { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: #f1f5f9; color: #475569; flex-shrink: 0; }
        
        .card-desc { font-size: 11px; color: #475569; margin-bottom: 6px; line-height: 1.4; }
        .card-footer { display: flex; gap: 6px; border-top: 1px solid #f1f5f9; padding-top: 6px; }
        .btn { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 4px; }
        .btn-primary { background: #FF5A36; color: white; }
        
        /* 모바일 대응 (반응형) */
        @media(max-width: 900px) {
            .main-container { flex-direction: column; }
            .map-section { height: 35vh; flex: none; }
            .sidebar { width: 100%; height: 65vh; border-left: none; border-top: 1px solid #e2e8f0; }
            h1 { font-size: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span class="logo-badge">조래블</span>
            <h1>후쿠오카 정보 총 정리</h1>
        </div>
        <div class="header-right">
            <a href="https://maps.google.com/?q=Kitakyushu+Fukuoka" target="_blank" class="map-big-btn">🗺️ 전체지도</a>
            <a href="https://www.youtube.com/@jo-ravel" target="_blank" class="yt-btn">✈️ 유튜브</a>
        </div>
    </header>

    <div class="main-container">
        <!-- 전체 지역 뷰 구글맵 배경 -->
        <div class="map-section">
            <iframe id="mapFrame" class="map-iframe" src="https://maps.google.com/maps?q=Kitakyushu+Fukuoka&t=m&z=9&output=embed"></iframe>
        </div>

        <!-- 사이드바 카드 리스트 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>🗺️ 조래블 추천 코스 & 맛집·숙소</h2>
                <p>카드를 누르면 해당 위치가 지도에 연동됩니다.</p>
            </div>
            <div class="card-list" id="cardList"></div>
        </div>
    </div>

    <script>
        const travelData = [
            { step: 1, name: "후쿠오카 공항", query: "Fukuoka Airport", tag: "입국", desc: "여행의 시작점! 공항에서 지하철 타고 하카타로 빠르게 이동.", food: "-", hotel: "-" },
            { step: 2, name: "하카타", query: "Hakata Station Fukuoka", tag: "숙소/맛집", desc: "첫날 숙소 체크인 및 모츠나베 로컬 맛집 탐방.", food: "하카타 모츠나베 오오야마", hotel: "THE BLOSSOM HAKATA" },
            { step: 3, name: "구로사키", query: "Kurosaki Station Kitakyushu", tag: "경유/로컬", desc: "기타큐슈 깊숙한 로컬 감성을 느낄 수 있는 환승 거점.", food: "구로사키 야키토리 거리", hotel: "-" },
            { step: 4, name: "히가시나카마역", query: "Higashinakama Station", tag: "베이스캠프", desc: "이번 일정의 핵심 거점! 조래블이 머문 아늑한 숙소 위치.", food: "역 앞 수제 돈카츠 전문점", hotel: "기타큐슈 비즈니스 스테이" },
            { step: 5, name: "모지코역", query: "Mojiko Station", tag: "관광/명소", desc: "레트로한 건축물과 바닷가 풍경이 예술인 낭만 항구 도시.", food: "모지코 명물 야끼카레 (베어후르츠)", hotel: "-" },
            { step: 6, name: "시모노세키", query: "Shimonoseki Station", tag: "맛집/시장", desc: "간몬 해협 건너서 즐기는 싱싱한 복어(후쿠) 요리와 가라토 시장.", food: "가라토 시장 초밥 세트", hotel: "-" },
            { step: 7, name: "고쿠라", query: "Kokura Station Kitakyushu", tag: "쇼핑/성", desc: "고쿠라 성 산책 및 대형 쇼핑몰 리버워크 탐방.", food: "시로야 베이커리 (연유빵)", hotel: "-" },
            { step: 8, name: "히가시나카마역", query: "Higashinakama Station", tag: "휴식", desc: "일정 중반 재충전을 위해 다시 들른 베이스캠프.", food: "로컬 라멘 맛집", hotel: "기타큐슈 비즈니스 스테이" },
            { step: 9, name: "고노세야", query: "Konoseya Kitakyushu", tag: "숨은 스팟", desc: "현지인들만 아는 아기자기한 동네 산책 코스.", food: "수제 디저트 카페", hotel: "-" },
            { step: 10, name: "히가시나카마역", query: "Higashinakama Station", tag: "휴식", desc: "일정 마무리 전 편안하게 휴식하는 숙소 인근.", food: "이자카야 꼬치구이", hotel: "기타큐슈 비즈니스 스테이" },
            { step: 11, name: "구로사키", query: "Kurosaki Station Kitakyushu", tag: "경유", desc: "하카타로 돌아가는 길에 잠시 들르는 환승 포인트.", food: "-", hotel: "-" },
            { step: 12, name: "하카타", query: "Hakata Station Fukuoka", tag: "마지막 밤", desc: "여행의 마지막 밤을 기념하는 하카타 포차 거리 산책.", food: "나카스 야타이 (포장마차 라멘)", hotel: "하카타 호텔" },
            { step: 13, name: "후쿠오카 공항", query: "Fukuoka Airport", tag: "출국", desc: "알차게 즐기고 한국으로 돌아가는 공항 귀환 루트.", food: "면세점 쇼핑 리스트", hotel: "-" }
        ];

        let activeIndex = 0;

        function renderApp() {
            const cardList = document.getElementById('cardList');
            cardList.innerHTML = '';

            travelData.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = `place-card ${idx === activeIndex ? 'active' : ''}`;
                card.onclick = () => selectPlace(idx);
                card.innerHTML = `
                    <div class="card-top">
                        <div style="display: flex; align-items: center; min-width:0; flex:1;">
                            <div class="place-num">${item.step}</div>
                            <div class="place-title" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</div>
                        </div>
                        <span class="place-tag">${item.tag}</span>
                    </div>
                    <div class="card-desc">${item.desc}</div>
                    <div style="font-size: 11px; color: #64748b; margin-bottom: 6px;">
                        🍽️ 맛집: <b>${item.food}</b><br>
                        🏨 숙소: <b>${item.hotel}</b>
                    </div>
                    <div class="card-footer">
                        <a href="https://maps.google.com/?q=${encodeURIComponent(item.name + ' 후쿠오카')}" target="_blank" class="btn btn-primary" onclick="event.stopPropagation()">📍 구글맵 보기</a>
                    </div>
                `;
                cardList.appendChild(card);
            });
        }

        function selectPlace(idx) {
            activeIndex = idx;
            renderApp();
            
            const item = travelData[idx];
            const mapFrame = document.getElementById('mapFrame');
            mapFrame.src = `https://maps.google.com/maps?q=${encodeURIComponent(item.query)}&t=m&z=14&output=embed`;

            const cards = document.querySelectorAll('.place-card');
            if (cards[idx]) {
                cards[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        renderApp();
    </script>
</body>
</html>
